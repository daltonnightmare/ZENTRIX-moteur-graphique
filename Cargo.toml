# =============================================================================
#  Cargo.toml RACINE — le "workspace" (espace de travail) ZENTRIX
# =============================================================================
#
# Ce fichier ne décrit PAS un programme : il regroupe plusieurs "crates"
# (bibliothèques ou exécutables Rust) qui sont compilées ensemble.
# Avantages :
#   - un seul dossier `target/` partagé  -> compilations beaucoup plus rapides ;
#   - un seul `Cargo.lock`               -> toutes les crates utilisent les mêmes versions ;
#   - des versions de dépendances déclarées UNE seule fois (section plus bas).
#
# Voir documentation/guide-debutant/03-cargo-et-workspace.md pour les détails.

[workspace]
# Le "resolver" 3 est l'algorithme moderne de résolution des dépendances
# (par défaut avec l'édition 2024).
resolver = "3"

# Liste des crates qui font partie du workspace.
# L'ordre n'a pas d'importance : Cargo calcule lui-même l'ordre de compilation.
members = [
    "crates/zentrix-core",      # types de base (couleurs, temps)       — aucune dépendance GPU
    "crates/zentrix-platform",  # fenêtre + boucle d'événements          — enveloppe winit
    "crates/zentrix-rhi",       # accès bas niveau au GPU                — enveloppe wgpu
    "crates/zentrix-render",    # rendu haut niveau (pipelines, shaders) — utilise le RHI
    "crates/zentrix-assets",    # chargement des fichiers (images...)    — sans GPU
    "crates/zentrix-scene",     # la scène : entités et composants (ECS)
    "crates/zentrix-ui",        # interface graphique de debug (egui)
    "crates/zentrix-physics",   # physique : corps rigides, collisions (rapier3d)
    "crates/zentrix-audio",     # son : bruitages positionnés dans la scène (kira)
    "crates/zentrix-app",       # l'exécutable qui assemble tout
]

# Métadonnées partagées : chaque crate peut écrire `version.workspace = true`
# pour hériter de ces valeurs au lieu de les répéter.
[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["daltonnightmare"]

# Versions des dépendances externes, centralisées ici.
# Dans une crate, on écrit ensuite simplement : `wgpu = { workspace = true }`.
[workspace.dependencies]
# --- Nos propres crates (chemins locaux) ---
zentrix-core     = { path = "crates/zentrix-core" }
zentrix-platform = { path = "crates/zentrix-platform" }
zentrix-rhi      = { path = "crates/zentrix-rhi" }
zentrix-render   = { path = "crates/zentrix-render" }
zentrix-assets   = { path = "crates/zentrix-assets" }
zentrix-scene    = { path = "crates/zentrix-scene" }
zentrix-ui       = { path = "crates/zentrix-ui" }
zentrix-physics  = { path = "crates/zentrix-physics" }
zentrix-audio    = { path = "crates/zentrix-audio" }

# --- Fenêtre et événements ---
winit = "0.30"          # crée la fenêtre, reçoit clavier/souris/redimensionnement

# --- GPU ---
wgpu = "30"             # API graphique portable (Vulkan / DirectX 12 / Metal / WebGPU)
pollster = "1"          # permet d'attendre une fonction `async` sans runtime async complet
naga = { version = "30", features = ["wgsl-in"] } # compilateur de shaders de wgpu (tests des .wgsl)
bytemuck = { version = "1", features = ["derive"] }  # convertit nos structs en octets pour le GPU

# --- Fichiers ---
# Décodage d'images. `default-features = false` : on n'active que les formats
# utiles (PNG, JPEG) au lieu d'une vingtaine, ce qui accélère la compilation.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] } # modèles 3D glTF 2.0 (.gltf, .glb)

# --- Interface graphique (egui) ---
# Les trois crates doivent avoir la même version, et egui-wgpu / egui-winit
# doivent utiliser EXACTEMENT nos versions de wgpu (30) et winit (0.30).
egui = { version = "0.37", features = ["default_fonts"] } # `default_fonts` : les polices intégrées (sinon, aucun texte)
egui-wgpu = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "wayland", "x11"] }

# --- Sérialisation (sauvegarde des scènes) ---
serde = { version = "1", features = ["derive"] } # `#[derive(Serialize, Deserialize)]` : convertir nos types en texte et inversement
ron = "0.12"            # format RON (Rusty Object Notation) : lisible, proche de la syntaxe Rust

# --- ECS (Entity Component System) ---
hecs = "0.11"           # ECS minimaliste : un « World » d'entités, des composants, des requêtes

# --- Physique ---
# rapier utilise sa propre version de glam (0.33) : zentrix-physics convertit
# les vecteurs à la frontière (voir crates/zentrix-physics/src/lib.rs).
rapier3d = "0.36"       # moteur physique : corps rigides, collisions, rayons

# --- Audio ---
# Sans les options par défaut : seulement la sortie son (cpal) et les formats
# WAV et OGG, au lieu d'une dizaine de décodeurs. kira utilise la même
# version de glam que ZENTRIX : aucune conversion n'est nécessaire.
kira = { version = "0.12", default-features = false, features = ["cpal", "wav", "ogg", "vorbis"] }

# --- Performance ---
rayon = "1"             # partager un travail entre tous les cœurs du processeur
# Mesures pour le profileur Tracy. Les macros `profiling::scope!` ne font
# RIEN tant que la feature `tracy` de zentrix-app n'est pas activée.
profiling = "1"

# --- Mathématiques ---
glam = { version = "0.34", features = ["bytemuck", "serde"] } # vecteurs / matrices / quaternions (ré-exporté par zentrix_core::math)

# --- Journalisation (logs) ---
log = "0.4"             # "façade" : les crates écrivent `log::info!(...)`
env_logger = "0.11"     # implémentation : affiche les logs dans le terminal

# --- Gestion des erreurs ---
anyhow = "1"            # erreurs "faciles" pour les applications
thiserror = "2"         # erreurs typées et précises pour les bibliothèques

# Profil de compilation "dev" (cargo build / cargo run) :
# on optimise un peu les DÉPENDANCES (wgpu, winit...) car elles sont très lentes
# sans optimisation, tout en gardant NOTRE code non optimisé pour compiler vite
# et déboguer facilement.
[profile.dev.package."*"]
opt-level = 2
