[package]
name = "zentrix-render"
description = "Rendu haut niveau de ZENTRIX : passes, pipelines, shaders, maillages."
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
zentrix-core = { workspace = true }
# wgpu est utilisé via `zentrix_rhi::wgpu` (ré-export) : pas besoin de le déclarer ici.
zentrix-rhi = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
# Répartir le tri des objets entre les cœurs du processeur (culling.rs).
rayon = { workspace = true }
# Les zones mesurées par Tracy (`profiling::scope!`) : sans la feature
# `tracy` de zentrix-app, ces macros ne font rien et ne coûtent rien.
profiling = { workspace = true }

# Dépendances utilisées seulement par `cargo test`.
[dev-dependencies]
# naga est le compilateur de shaders de wgpu : il permet de vérifier les
# fichiers .wgsl dans les tests, sans carte graphique.
naga = { workspace = true }
